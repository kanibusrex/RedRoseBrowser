<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    DESIGN.md §7.12: restrict script-src to 'self', no inline scripts,
    belt-and-suspenders given nodeIntegration is already off for this
    renderer. This chrome UI is always loaded via loadFile() from local
    disk (§7.11) — never remote content.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vellum</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="chrome-root">
    <nav class="rail">
      <button class="glyph" id="btnHome" type="button" title="Vellum" aria-label="Vellum">
        <svg class="glyph-vellum" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="vSheet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8efdd"/><stop offset="1" stop-color="#e0cca4"/></linearGradient><linearGradient id="vBack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7d7b7"/><stop offset="1" stop-color="#cbb184"/></linearGradient><linearGradient id="vFold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcc79f"/><stop offset="1" stop-color="#b79d6f"/></linearGradient></defs><path d="M150 118 h146 l56 56 v230 h-202 Z" fill="rgba(0,0,0,0.42)" transform="translate(12,15)"/><path class="vellum-under" d="M150 118 h146 l56 56 v230 h-202 Z" fill="url(#vBack)" stroke="#b39a6c" stroke-width="2"/><g class="vellum-leaf"><path d="M150 110 h146 v56 h56 v230 h-202 Z" fill="url(#vSheet)" stroke="#cdb88f" stroke-width="2.5"/><path d="M296 110 v56 h56 Z" fill="url(#vFold)" stroke="#cdb88f" stroke-width="2" stroke-linejoin="round"/><g stroke="#b8894f" stroke-width="4.5" stroke-linecap="round" opacity="0.45"><line x1="190" y1="250" x2="316" y2="250"/><line x1="190" y1="288" x2="316" y2="288"/><line x1="190" y1="326" x2="298" y2="326"/></g><path d="M176 150 h24 l20 62 20-62 h24 l-32 96 h-24 Z" fill="#a4283a"/><path d="M176 150 h24 l20 62 20-62 h24 l-32 96 h-24 Z" fill="none" stroke="#71111d" stroke-width="2.5" stroke-linejoin="round"/></g><rect class="vellum-shade" x="150" y="106" width="202" height="292" fill="#3a1c0a" opacity="0"/></svg>
      </button>
      <div class="rail-namewrap"><span class="rail-name">Vellum</span></div>
      <div class="rail-group">
        <button id="btn-bookmarks" class="icon-btn" title="Bookmarks" aria-label="Bookmarks" aria-haspopup="true" data-tip="Bookmarks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button id="btn-history" class="icon-btn" title="History" aria-label="History" aria-haspopup="true" data-tip="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
        </button>
        <button id="btn-downloads" class="icon-btn" title="Downloads" aria-label="Downloads" aria-haspopup="true" data-tip="Downloads">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
        <button id="btn-extensions" class="icon-btn" title="Extensions" aria-label="Extensions" aria-haspopup="true" data-tip="Extensions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10.5V7a2 2 0 0 0-2-2h-3.5a1.5 1.5 0 0 1-3 0H8a2 2 0 0 0-2 2v3.5a1.5 1.5 0 0 1 0 3V17a2 2 0 0 0 2 2h3.5a1.5 1.5 0 0 1 3 0H18a2 2 0 0 0 2-2v-3.5a1.5 1.5 0 0 1 0-3Z"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" title="Appearance" aria-label="Appearance" aria-haspopup="true" data-tip="Appearance">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="btn-focus-mode" class="icon-btn" title="Focus Mode" aria-label="Enter focus mode" data-tip="Focus Mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
    </nav>
    <nav id="sidebar" aria-label="Open tabs">
      <div id="tab-list" role="tablist"></div>
    </nav>
    <div id="sidebar-resize-handle" role="separator" aria-orientation="vertical" aria-label="Resize tab panel"></div>
    <div id="main-col">
      <div id="toolbar">
        <button id="btn-back" class="nav-btn" title="Back" disabled>&#x2190;</button>
        <button id="btn-forward" class="nav-btn" title="Forward" disabled>&#x2192;</button>
        <button id="btn-reload" class="nav-btn" title="Reload">&#x21bb;</button>
        <button id="btn-home" class="nav-btn" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
        </button>
        <div id="address-bar-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span id="security-icon" aria-hidden="true">&#x1F513;</span>
          <input
            id="address-bar"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search Google or type a URL"
          />
          <button id="address-clear" aria-label="Clear" title="Clear">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <span class="kbd" id="address-kbd"></span>
        </div>
        <button id="btn-star" class="nav-btn" title="Bookmark this page" aria-label="Bookmark this page" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l3.09 6.26 6.91 1-5 4.87 1.18 6.88L12 18.27l-6.18 3.24L7 14.63l-5-4.87 6.91-1z"/></svg>
        </button>
        <button id="btn-copy-url" class="nav-btn" title="Copy page URL" aria-label="Copy page URL">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
      </div>
      <div id="progress-bar"><div id="progress-bar-fill"></div></div>
      <div id="address-suggestions" role="listbox"></div>
      <div id="find-bar">
        <input id="find-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Find in page" />
        <span id="find-count"></span>
        <button id="find-prev" class="nav-btn" title="Previous match" aria-label="Previous match">&#x2191;</button>
        <button id="find-next" class="nav-btn" title="Next match" aria-label="Next match">&#x2193;</button>
        <button id="find-close" class="nav-btn" title="Close" aria-label="Close find bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <div class="modal-head">
        <h2>Settings</h2>
        <button class="modal-close" id="settingsClose" aria-label="Close" title="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <h3 class="modal-section">General</h3>
        <div class="field">
          <label>Search engine</label>
          <select id="settings-search-engine"></select>
        </div>
        <div class="field">
          <label>Home page</label>
          <input id="settings-home-page" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Leave blank for the default new tab page" />
        </div>
        <div class="field">
          <label class="field-checkbox">
            <input id="settings-adblock" type="checkbox" />
            Block ads and trackers
          </label>
        </div>
        <div class="field">
          <button type="button" class="btn-secondary" id="settings-check-updates">Check for Updates…</button>
        </div>
        <h3 class="modal-section">Appearance</h3>
        <div class="field">
          <label>Light themes</label>
          <div class="theme-grid" id="themeLight"></div>
        </div>
        <div class="field">
          <label>Dark themes</label>
          <div class="theme-grid" id="themeDark"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
