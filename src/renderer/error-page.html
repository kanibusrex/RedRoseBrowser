<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Loaded into a per-tab BrowserView on a failed/blocked navigation
       (see TabManager's did-fail-load handler) — untrusted network
       conditions triggered this, so it gets the same strict, no-inline-
       script CSP as the chrome renderer. -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Can't reach this page</title>
  <link rel="stylesheet" href="error-page.css" />
</head>
<body>
  <div class="wrap">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 8v5"/>
      <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
    </svg>
    <h1 id="heading">This site can't be reached</h1>
    <p id="detail" class="detail"></p>
    <p id="urlline" class="url"></p>
    <a id="retry" class="retry" href="#">Try again</a>
    <p class="fineprint">
      RedRose Browser blocked or could not complete this navigation. If this
      is a certificate warning, the site's connection may not be private —
      only continue if you understand the risk.
    </p>
  </div>
  <script src="error-page.js"></script>
</body>
</html>
