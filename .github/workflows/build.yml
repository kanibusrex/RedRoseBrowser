name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: mac
            # latest*.yml/*.blockmap are electron-updater's update-feed
            # metadata (see src/main/updater.js / DESIGN.md §8.17) —
            # generated alongside the dmg/zip because package.json's
            # build.publish names a provider, but never uploaded to
            # GitHub by electron-builder itself (--publish never); the
            # release job below uploads them to the tag's release
            # instead. `latest*.yml` (not a bare `*.yml`) deliberately
            # excludes electron-builder's own release/builder-debug.yml,
            # which isn't update-feed metadata and has no reason to be a
            # public release asset (found the hard way — it showed up in
            # v1.1.0's draft release and had to be removed by hand).
            glob: |
              release/*.dmg
              release/*.zip
              release/latest*.yml
              release/*.blockmap
          - os: windows-latest
            script: dist:win
            artifact: windows
            glob: |
              release/*.exe
              release/latest*.yml
              release/*.blockmap

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: RedRose-Browser-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    # Only when the build was triggered by a version tag (v1.0.0, etc.)
    # — a plain push to main just builds and uploads run artifacts above,
    # it doesn't publish anything.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: true
